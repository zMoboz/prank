<!DOCTYPE html>
<html>
<head>
<title>Loading...</title>

<style>
body{
    margin:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
    font-family:Arial;
}

#jumpscare{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}
</style>

</head>
<body onclick="startPrank()">

<h1>Klik dimana saja untuk melanjutkan...</h1>

<img id="jumpscare" src="jumpscare.jpg">

<audio id="sound">
    <source src="scream.mp3" type="audio/mpeg">
</audio>

<script>
function startPrank(){

    // fullscreen
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
    }

    // tampilkan jumpscare
    document.getElementById("jumpscare").style.display = "block";

    // play audio volume 100%
    var audio = document.getElementById("sound");
    audio.volume = 1.0;
    audio.play();
}
</script>

</body>
</html>
