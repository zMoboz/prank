<!DOCTYPE html>
<html>
<head>
<title>Loading...</title>
<style>
body{
  background:black;
  color:white;
  text-align:center;
  margin-top:200px;
  font-family:Arial;
}
img{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:none;
}
button{
  font-size:22px;
  padding:15px 30px;
}
</style>
</head>

<body>

<h2>Tap untuk melanjutkan</h2>
<button onclick="start()">Start</button>

<img id="jumpscare" src="jumpscare.jpg">

<audio id="audio" src="scream.mp3"></audio>

<script>
function start(){
  var audio = document.getElementById("audio");
  audio.volume = 1.0;
  audio.play();

  document.getElementById("jumpscare").style.display="block";
}
</script>

</body>
</html>
